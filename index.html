<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeXTDEV.world — Personal Workstation</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080808;
  color: #ddd;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.workstation {
  width: 100%;
  max-width: 1000px;
  background: #151515;
  padding: 36px;
  border: 2px solid #444;
  box-shadow:
    inset 2px 2px 0 #777,
    inset -2px -2px 0 #050505,
    0 25px 65px #000;
}

.grille {
  height: 48px;
  background: repeating-linear-gradient(
    to bottom,
    #030303 0px,
    #030303 3px,
    #303030 4px,
    #050505 5px,
    #050505 7px
  );
  border: 2px solid #050505;
  box-shadow:
    inset 0 2px 4px #000,
    0 1px 0 #555;
}

.center {
  min-height: 330px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 45px 15px;
}

.logo {
  width: 230px;
  max-width: 75%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 15px 15px #000);
}

.window {
  border: 2px solid;
  border-color: #eee #333 #333 #eee;
  background: #999;
  box-shadow: 3px 4px 0 #050505;
  margin-bottom: 28px;
}

.titlebar {
  background: linear-gradient(
    #555,
    #111 65%,
    #000
  );
  color: white;
  font-size: 13px;
  font-weight: bold;
  padding: 9px 12px;
  border-bottom: 2px solid #000;
}

.window-content {
  color: #222;
  text-align: center;
  padding: 24px;
  font-family: monospace;
  font-size: 13px;
  letter-spacing: 1px;
}

.status {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 18px 0;
  color: #aaa;
  font: 11px monospace;
}

.led {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: #77d977;
  box-shadow: 0 0 7px #66ff66;
  margin-right: 7px;
}

footer {
  color: #777;
  text-align: center;
  font: 11px monospace;
  margin-top: 18px;
}

@media (max-width: 600px) {
  body { padding: 12px; }
  .workstation { padding: 18px; }
  .center { min-height: 260px; }
  .logo { width: 190px; }
  .status { font-size: 9px; }
}
</style>
</head>

<body>

<main class="workstation">

  <div class="grille"></div>

  <section class="center">
    <img
      src="next-logo.png"
      alt="Original NeXT logo"
      class="logo"
    >
  </section>

  <section class="window">
    <div class="titlebar">
      NeXTDEV.world — Workspace
    </div>

    <div class="window-content">
      WELCOME TO NeXTDEV.WORLD
      <p>Personal Retrocomputing Workstation</p>
      <p>NeXT / UNIX / TECHNOLOGY</p>
    </div>
  </section>

  <div class="status">
    <span><span class="led"></span>SYSTEM READY</span>
    <span>NeXTSTEP INSPIRED</span>
  </div>

  <div class="grille"></div>

  <footer>
    NeXTDEV.world © 2026
    <p>Independent retrocomputing project</p>
  </footer>

</main>

</body>
</html>
