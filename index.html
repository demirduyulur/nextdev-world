
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>NeXTDEV.world — Workstation Selector</title>
<meta name="description" content="NeXTDEV.world — Choose between the Development and Music workstations.">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080808;
  color: #ddd;
  font-family: Helvetica, Arial, sans-serif;
}

.workstation {
  width: 100%;
  max-width: 1100px;
  padding: 30px;
  background: #191919;
  border: 3px solid;
  border-color: #777 #050505 #050505 #777;
  box-shadow: inset 2px 2px #aaa,
              inset -2px -2px #000,
              0 25px 60px #000;
}

.grille {
  height: 55px;
  border: 3px solid #050505;
  background: repeating-linear-gradient(
    to bottom,
    #000 0px,
    #000 3px,
    #444 4px,
    #090909 5px,
    #090909 8px
  );
  box-shadow: inset 0 3px 6px #000,
              0 2px 1px #555;
}

.logo-area {
  min-height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 10px;
}

.next-logo {
  width: 210px;
  max-width: 75%;
  height: auto;
  filter: drop-shadow(0 14px 15px #000);
}

.window {
  margin: 0 auto 25px;
  max-width: 760px;
  background: #aaa;
  border: 3px solid;
  border-color: #eee #333 #333 #eee;
  box-shadow: 4px 4px #000;
}

.titlebar {
  padding: 10px 15px;
  background: linear-gradient(#555, #111);
  color: white;
  border-bottom: 2px solid #000;
  font-size: 13px;
  font-weight: bold;
}

.window-content {
  padding: 30px 20px;
  color: #111;
  text-align: center;
  font-family: monospace;
}

.window-content h1 {
  margin: 0 0 12px;
  font-size: 22px;
  letter-spacing: 2px;
}

.window-content p {
  font-size: 13px;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 30px;
}

.choice {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 155px;
  padding: 20px 12px;
  color: #111;
  background: #bcbcbc;
  text-decoration: none;
  border: 3px solid;
  border-color: #fff #444 #444 #fff;
  box-shadow: 4px 4px 0 #555;
}

.choice:hover {
  background: #ddd;
}

.choice:active {
  border-color: #444 #fff #fff #444;
  box-shadow: none;
  transform: translate(3px, 3px);
}

.choice:focus-visible {
  outline: 3px solid #111;
  outline-offset: 3px;
}

.choice-icon {
  font-size: 38px;
  margin-bottom: 12px;
}

.choice-name {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 2px;
}

.choice-description {
  margin-top: 10px;
  font-size: 11px;
}

.status {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 20px 0;
  color: #aaa;
  font: 11px monospace;
}

.led {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 8px;
  background: #77ff77;
  box-shadow: 0 0 8px #44ff44;
}

footer {
  padding-top: 18px;
  color: #888;
  text-align: center;
  font: 11px monospace;
}

@media (max-width: 600px) {
  body { padding: 10px; }
  .workstation { padding: 16px; }
  .logo-area { min-height: 230px; }
  .next-logo { width: 180px; }
  .window-content { padding: 22px 12px; }
  .window-content h1 { font-size: 18px; }
  .choices { gap: 12px; }
  .choice { min-height: 140px; padding: 14px 6px; }
  .choice-icon { font-size: 30px; }
  .choice-name { font-size: 16px; }
  .choice-description { font-size: 10px; }
  .status { font-size: 9px; }
}
</style>
</head>

<body>
<main class="workstation">

  <div class="grille"></div>

  <section class="logo-area">
    <img
      class="next-logo"
      src="https://upload.wikimedia.org/wikipedia/commons/3/30/NeXT_logo.svg"
      alt="NeXT Computer logo"
    >
  </section>

  <section class="window">
    <div class="titlebar">
      NeXTDEV.world — Workspace Manager
    </div>

    <div class="window-content">
      <h1>SELECT WORKSTATION</h1>
      <p>Welcome to NeXTDEV.world</p>
      <p>Choose an environment to launch.</p>

      <div class="choices">

        <a class="choice" href="/Dev/">
          <span class="choice-icon">⌘</span>
          <span class="choice-name">DEV</span>
          <span class="choice-description">
            UNIX / COMPUTING
          </span>
        </a>

        <a class="choice" href="/Music/">
          <span class="choice-icon">♫</span>
          <span class="choice-name">MUSIC</span>
          <span class="choice-description">
            AUDIO / ARTIST
          </span>
        </a>

      </div>
    </div>
  </section>

  <div class="status">
    <span><span class="led"></span>SYSTEM READY</span>
    <span>SELECT ENVIRONMENT</span>
  </div>

  <div class="grille"></div>

  <footer>
    NeXTDEV.world © 2026
    <p>Independent creative workstation</p>
  </footer>

</main>
</body>
</html>
